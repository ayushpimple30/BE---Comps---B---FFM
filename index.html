<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suchana · Send to BMO</title><style>
:root{color-scheme:dark;--mint:#75f0d0;--blue:#91a7ff;--muted:#a6bac8}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#174051 0,#07121c 62%);font:16px system-ui,Segoe UI,sans-serif;color:#f4fbff}main{width:min(640px,100%);padding:clamp(22px,5vw,38px);border:1px solid #75f0d044;border-radius:25px;background:#0a1b28;box-shadow:0 25px 80px #0007}.brand{display:flex;align-items:center;gap:12px;margin-bottom:32px}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,var(--mint),var(--blue));color:#07121c;font-size:25px;font-weight:900}.brand b{display:block;letter-spacing:.12em}.brand small{color:var(--muted);letter-spacing:.16em}h1{font-size:clamp(28px,6vw,40px);line-height:1.08;margin:0 0 12px}p{color:var(--muted);line-height:1.55}.drop{display:block;margin:24px 0;padding:24px 18px;border:1px dashed #75f0d099;border-radius:18px;text-align:center;background:#75f0d009;cursor:pointer}.drop input{display:block;width:100%;margin-top:16px;color:var(--muted)}button{width:100%;border:0;border-radius:12px;padding:15px;background:linear-gradient(100deg,var(--mint),#a7b6ff);font-weight:800;font-size:15px;color:#06131c;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.preview{display:none;max-width:100%;max-height:300px;object-fit:contain;margin:16px auto 0;border-radius:12px}.status{margin-top:18px;padding:13px;border-radius:12px;background:#152b38;color:var(--muted);overflow-wrap:anywhere}.status.ok{color:var(--mint)}.status.err{color:#ffaaa9}.foot{font-size:12px;margin-top:20px;color:#8299a9}</style></head><body><main><header class="brand"><div class="logo">b.</div><div><b>SUCHANA · BMO</b><small>FILE TRANSFER</small></div></header><h1>Send a photo<br><span style="color:var(--mint)">to your BMO.</span></h1><p>Choose an image to upload it to your Suchana server. Your Raspberry Pi 5 will securely pick it up and download it.</p><form id="uploadForm" action="upload.php" method="post" enctype="multipart/form-data"><label class="drop"><strong>Choose an image</strong><br><span style="color:var(--muted);font-size:13px">PNG, JPG, WEBP or GIF · max 10 MB</span><input id="photo" type="file" name="photo" accept="image/png,image/jpeg,image/webp,image/gif" required><img class="preview" id="preview" alt="Selected image preview"></label><button id="submit" type="submit">Upload and send to BMO ↗</button></form><div class="status" id="status" role="status">Ready when you are.</div><div class="foot">Uploads are stored on your server. Only devices with the configured API secret can retrieve queued files.</div></main><script>
const form=document.getElementById('uploadForm'),file=document.getElementById('photo'),preview=document.getElementById('preview'),box=document.getElementById('status'),btn=document.getElementById('submit');
file.addEventListener('change',()=>{const f=file.files[0];if(!f){preview.style.display='none';return}if(!f.type.startsWith('image/')){box.className='status err';box.textContent='Please choose an image.';file.value='';return}preview.src=URL.createObjectURL(f);preview.style.display='block';box.className='status';box.textContent=`Selected: ${f.name} (${(f.size/1048576).toFixed(2)} MB)`});
form.addEventListener('submit',async e=>{e.preventDefault();if(!file.files[0])return;btn.disabled=true;btn.textContent='Uploading…';box.className='status';box.textContent='Uploading image to Suchana server…';try{const r=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Upload failed');box.className='status ok';box.textContent=`Uploaded: ${d.filename}. Waiting for Raspberry Pi 5 to collect it.`;form.reset();preview.style.display='none'}catch(e){box.className='status err';box.textContent=e.message+' — check PHP settings and folder permissions.'}finally{btn.disabled=false;btn.textContent='Upload and send to BMO ↗'}});
</script></body></html>
