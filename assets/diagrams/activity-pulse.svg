<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">FFM Sentinel activity visualization</title>
<desc id="desc">Decorative cyan and violet activity graph with fluctuating bars and a rising line. Illustrative, not real GitHub analytics.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111b35"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="300" rx="18" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="34" y="38" fill="#e2e8f0" font-size="20" font-weight="700">FFM SENTINEL · ACTIVITY PULSE</text>
<text x="966" y="38" fill="#a5b4fc" font-size="11" text-anchor="end" letter-spacing="1.4">ILLUSTRATIVE VISUAL</text>
</g>
<g stroke="#334155" stroke-opacity=".6" stroke-width="1">
<path d="M40 75H960 M40 120H960 M40 165H960 M40 210H960 M40 250H960"/>
<path d="M40 60V250 M220 60V250 M400 60V250 M580 60V250 M760 60V250 M960 60V250" stroke-dasharray="3 7"/>
</g>
<g fill="#22d3ee" opacity=".55">
<rect x="55" y="214" width="18" height="36" rx="4"><animate attributeName="height" values="20;36;28;36;20" dur="3.2s" repeatCount="indefinite"/><animate attributeName="y" values="230;214;222;214;230" dur="3.2s" repeatCount="indefinite"/></rect>
<rect x="95" y="190" width="18" height="60" rx="4"/><rect x="135" y="202" width="18" height="48" rx="4"/><rect x="175" y="165" width="18" height="85" rx="4"/><rect x="215" y="185" width="18" height="65" rx="4"/><rect x="255" y="145" width="18" height="105" rx="4"/><rect x="295" y="174" width="18" height="76" rx="4"/><rect x="335" y="126" width="18" height="124" rx="4"/><rect x="375" y="157" width="18" height="93" rx="4"/><rect x="415" y="137" width="18" height="113" rx="4"/><rect x="455" y="104" width="18" height="146" rx="4"/><rect x="495" y="146" width="18" height="104" rx="4"/><rect x="535" y="119" width="18" height="131" rx="4"/><rect x="575" y="88" width="18" height="162" rx="4"/><rect x="615" y="120" width="18" height="130" rx="4"/><rect x="655" y="98" width="18" height="152" rx="4"/><rect x="695" y="75" width="18" height="175" rx="4"/><rect x="735" y="106" width="18" height="144" rx="4"/><rect x="775" y="83" width="18" height="167" rx="4"/><rect x="815" y="65" width="18" height="185" rx="4"/><rect x="855" y="91" width="18" height="159" rx="4"/><rect x="895" y="70" width="18" height="180" rx="4"/>
</g>
<path d="M55 218 L104 195 L144 207 L184 168 L224 187 L264 150 L304 176 L344 132 L384 160 L424 139 L464 110 L504 148 L544 123 L584 92 L624 124 L664 101 L704 79 L744 108 L784 86 L824 68 L864 94 L904 72 L945 82 L945 250 L55 250Z" fill="url(#area)"/>
<path d="M55 218 L104 195 L144 207 L184 168 L224 187 L264 150 L304 176 L344 132 L384 160 L424 139 L464 110 L504 148 L544 123 L584 92 L624 124 L664 101 L704 79 L744 108 L784 86 L824 68 L864 94 L904 72 L945 82" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" stroke-dasharray="1200" stroke-dashoffset="1200">
<animate attributeName="stroke-dashoffset" from="1200" to="0" dur="3s" fill="freeze"/>
</path>
<circle cx="945" cy="82" r="5" fill="#c4b5fd" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="40" y="279" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="11">Illustrative motion graphic · not actual contribution or commit data</text>
</svg>