<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc">
<title id="title">FFM Sentinel animated interaction loop</title>
<desc id="desc">A decorative animated sequence representing input, local AI reasoning, and response. It does not represent live telemetry.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#10264a"/><stop offset="1" stop-color="#35136b"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="2" y="2" width="996" height="176" rx="22" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
<path d="M175 91 H825" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
<path d="M175 91 H825" stroke="url(#line)" stroke-width="2" stroke-dasharray="12 16" opacity=".8">
  <animate attributeName="stroke-dashoffset" from="0" to="-112" dur="3s" repeatCount="indefinite"/>
</path>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
  <g transform="translate(175 82)">
    <circle r="38" fill="#0e7490" opacity=".22"><animate attributeName="r" values="34;43;34" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle r="29" fill="#0b2236" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
    <path d="M-13 0 L-4 -10 L5 0 L-4 10 Z M5 0 L14 -9 L14 9 Z" fill="#67e8f9"/>
    <text y="63" fill="#e2e8f0" font-size="15" font-weight="700">PERCEIVE</text>
    <text y="81" fill="#94a3b8" font-size="11">Input devices</text>
  </g>
  <g transform="translate(500 82)">
    <circle r="38" fill="#6d28d9" opacity=".22"><animate attributeName="r" values="34;43;34" dur="2.2s" begin=".7s" repeatCount="indefinite"/></circle>
    <circle r="29" fill="#171333" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
    <path d="M-15 -8 Q-15 -16 -7 -16 H7 Q15 -16 15 -8 V5 Q15 13 7 13 H0 L-9 20 V13 H-7 Q-15 13 -15 5 Z" fill="none" stroke="#c4b5fd" stroke-width="2.5"/>
    <circle cx="-6" cy="-2" r="2" fill="#c4b5fd"/><circle cy="-2" r="2" fill="#c4b5fd"/><circle cx="6" cy="-2" r="2" fill="#c4b5fd"/>
    <text y="63" fill="#e2e8f0" font-size="15" font-weight="700">REASON</text>
    <text y="81" fill="#94a3b8" font-size="11">Local AI models</text>
  </g>
  <g transform="translate(825 82)">
    <circle r="38" fill="#047857" opacity=".22"><animate attributeName="r" values="34;43;34" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle r="29" fill="#062b2a" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
    <path d="M-14 0 L-4 10 L15 -11" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text y="63" fill="#e2e8f0" font-size="15" font-weight="700">RESPOND</text>
    <text y="81" fill="#94a3b8" font-size="11">Supported outputs</text>
  </g>
</g>
<circle r="5" fill="#fff" filter="url(#glow)">
  <animateMotion dur="4s" repeatCount="indefinite" path="M175 91 H825"/>
</circle>
<text x="500" y="27" fill="#c4b5fd" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="3">FFM SENTINEL • INTERACTION LOOP</text>
<text x="500" y="158" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="middle">Conceptual visual • not live device telemetry</text>
</svg>